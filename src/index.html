<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./ogp.png">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles/main.css">
  </head>
  <body>
    {{> header}}

    <main class="main">
      <section class="hero" id="top">
        <div class="hero__inner">
          <h1 class="hero__title">キャッチコピーが入ります</h1>
          <p class="hero__lead">リード文が入ります。ターゲットの不安に寄り添い、解決策を一言で示します。</p>
          <a class="button button--primary" href="#contact">お問い合わせ</a>
        </div>
      </section>

      <section class="section" id="feature">
        <div class="section__inner">
          <h2 class="section__title">特徴</h2>
          <ul class="cards">
            <li class="cards__item">
              <h3 class="cards__title">特徴 1</h3>
              <p class="cards__text">説明文が入ります。</p>
            </li>
            <li class="cards__item">
              <h3 class="cards__title">特徴 2</h3>
              <p class="cards__text">説明文が入ります。</p>
            </li>
            <li class="cards__item">
              <h3 class="cards__title">特徴 3</h3>
              <p class="cards__text">説明文が入ります。</p>
            </li>
          </ul>
        </div>
      </section>

      <section class="section section--contact" id="contact">
        <div class="section__inner">
          <h2 class="section__title">お問い合わせ</h2>
          <p class="section__text">CTA の本文が入ります。</p>
          <a class="button button--primary" href="#">フォームへ</a>
        </div>
      </section>
    </main>

    {{> footer}}

    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
